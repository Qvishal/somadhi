name: Shared Hosting Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options:
          - deploy
          - rollback
      project_key:
        description: Project key from the WhatsApp agent
        required: true
      project_name:
        description: Human-readable project name
        required: true
      environment:
        description: Deployment environment
        required: true
        default: Production
      remote_dir:
        description: FTP remote directory
        required: true
        default: /public_html
      build_command:
        description: Build command
        required: true
        default: npm ci && npm run build
      local_dir:
        description: Build output directory
        required: true
        default: dist
      rollback_run_id:
        description: Previous workflow run ID used for rollback
        required: false
      project_type:
        description: Project technology/type (helps choose build defaults)
        required: false
        default: node
        type: choice
        options:
          - node
          - react
          - nextjs
          - php
          - laravel
          - static

concurrency:
  group: shared-hosting-${{ inputs.project_key }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and FTP Deploy
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup PHP (if required)
        if: ${{ inputs.project_type == 'php' || inputs.project_type == 'laravel' }}
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, zip
          tools: composer:2

      - name: Determine build command and output directory
        id: vars
        run: |
          project_type="${{ inputs.project_type }}"
          build="${{ inputs.build_command }}"
          local="${{ inputs.local_dir }}"

          if [ -z "$build" ]; then
            case "$project_type" in
              node)
                build="npm ci && npm run build"
                local="${local:-dist}"
                ;;
              react)
                build="npm ci && npm run build"
                local="${local:-build}"
                ;;
              nextjs)
                # Try to build and export static output (if project supports export)
                build="npm ci && npm run build && (npm run export || true)"
                local="${local:-out}"
                ;;
              php)
                build="composer install --no-dev --optimize-autoloader"
                local="${local:-.}"
                ;;
              laravel)
                build="composer install --no-dev --optimize-autoloader && if [ -f package.json ]; then npm ci && npm run build; fi"
                local="${local:-public}"
                ;;
              static)
                build="true"
                local="${local:-.}"
                ;;
              *)
                build="npm ci && npm run build"
                local="${local:-dist}"
                ;;
            esac
          fi

          echo "build_cmd=$build" >> "$GITHUB_OUTPUT"
          echo "local_dir=$local" >> "$GITHUB_OUTPUT"

      - name: Build website
        shell: bash
        run: ${{ steps.vars.outputs.build_cmd }}

      - name: Validate build output
        shell: bash
        run: |
          local_dir="${{ steps.vars.outputs.local_dir }}"
          test -d "$local_dir"
          find "$local_dir" -type f | wc -l

      - name: Archive build artifact
        shell: bash
        run: |
          local_dir="${{ steps.vars.outputs.local_dir }}"
          tar -czf deployment-artifact.tar.gz -C "$local_dir" .

      - name: Store deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-hosting-${{ inputs.project_key }}-${{ github.run_id }}
          path: deployment-artifact.tar.gz
          retention-days: 30

      - name: Deploy to shared hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.vars.outputs.local_dir }}/
          server-dir: ${{ inputs.remote_dir }}/
          log-level: verbose
          timeout: 60000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env

  rollback:
    name: Rollback FTP Deployment
    if: ${{ inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate rollback target
        shell: bash
        run: test -n "${{ inputs.rollback_run_id }}"

      - name: Download previous deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-hosting-${{ inputs.project_key }}-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract rollback artifact
        shell: bash
        run: |
          mkdir rollback-build
          tar -xzf deployment-artifact.tar.gz -C rollback-build

      - name: Upload rollback build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: rollback-build/
          server-dir: ${{ inputs.remote_dir }}/
          log-level: verbose
          timeout: 60000
          dangerous-clean-slate: false
