name: Shared Hosting Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options:
          - deploy
          - rollback
      project_key:
        description: Project key from the WhatsApp agent
        required: true
      project_name:
        description: Human-readable project name
        required: true
      environment:
        description: Deployment environment
        required: true
        default: Production
      remote_dir:
        description: FTP remote directory
        required: true
        default: /public_html
      build_command:
        description: Build command (leave empty to auto-detect based on project type)
        required: false
        default: ""
      local_dir:
        description: Build output directory (leave empty to auto-detect based on project type)
        required: false
        default: ""
      rollback_run_id:
        description: Previous workflow run ID used for rollback
        required: false
      project_type:
        description: Project technology/type (helps choose build defaults)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - node
          - react
          - nextjs
          - php
          - laravel
          - static

concurrency:
  group: shared-hosting-${{ inputs.project_key }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and FTP Deploy
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine build command and output directory
        id: vars
        run: |
          # Parse FTP credentials and build configurations from PROJECTS_JSON secret
          projects_json='${{ secrets.PROJECTS_JSON }}'
          project_key="${{ inputs.project_key }}"

          if [ -n "$projects_json" ] && [ "$projects_json" != 'null' ]; then
            # Extract credentials with flexible naming (camelCase and snake_case)
            ftp_host=$(echo "$projects_json" | jq -r ".[\"$project_key\"].ftpHost // .[\"$project_key\"].ftp_host // .[\"$project_key\"].server // .[\"$project_key\"].host // \"\"")
            ftp_username=$(echo "$projects_json" | jq -r ".[\"$project_key\"].ftpUser // .[\"$project_key\"].ftp_user // .[\"$project_key\"].ftp_username // .[\"$project_key\"].username // .[\"$project_key\"].user // \"\"")
            ftp_password=$(echo "$projects_json" | jq -r ".[\"$project_key\"].ftpPassword // .[\"$project_key\"].ftp_password // .[\"$project_key\"].password // .[\"$project_key\"].pass // \"\"")
            remote_dir=$(echo "$projects_json" | jq -r ".[\"$project_key\"].remoteDir // .[\"$project_key\"].remote_dir // \"\"")
            
            # Extract build configuration from JSON
            proj_type_json=$(echo "$projects_json" | jq -r ".[\"$project_key\"].project_type // .[\"$project_key\"].projectType // \"\"")
            build_json=$(echo "$projects_json" | jq -r ".[\"$project_key\"].buildCommand // .[\"$project_key\"].build_command // \"\"")
            local_json=$(echo "$projects_json" | jq -r ".[\"$project_key\"].localDir // .[\"$project_key\"].local_dir // \"\"")
          fi

          # Fallbacks for credentials
          ftp_host="${ftp_host:-${{ secrets.FTP_HOST }}}"
          ftp_username="${ftp_username:-${{ secrets.FTP_USERNAME }}}"
          ftp_password="${ftp_password:-${{ secrets.FTP_PASSWORD }}}"
          remote_dir="${remote_dir:-${{ inputs.remote_dir }}}"

          # Determine project type
          project_type="${{ inputs.project_type }}"
          if [ "$project_type" = "auto" ] || [ -z "$project_type" ]; then
            project_type="${proj_type_json:-auto}"
          fi
          
          # Auto-detect project type if still auto/empty
          if [ "$project_type" = "auto" ] || [ -z "$project_type" ]; then
            if [ -f composer.json ]; then
              project_type="php"
            elif [ -f package.json ]; then
              project_type="node"
            else
              project_type="static"
            fi
          fi

          # Determine build command
          build="${{ inputs.build_command }}"
          build="${build:-$build_json}"

          get_node_build_cmd() {
            if [ -f yarn.lock ]; then
              echo "yarn install --frozen-lockfile && yarn build"
            elif [ -f pnpm-lock.yaml ]; then
              echo "pnpm install --frozen-lockfile && pnpm build"
            elif [ -f package-lock.json ]; then
              echo "npm ci && npm run build"
            elif [ -f package.json ]; then
              echo "npm install && npm run build"
            else
              echo "true"
            fi
          }

          if [ -z "$build" ]; then
            case "$project_type" in
              node|react)
                build=$(get_node_build_cmd)
                ;;
              nextjs)
                if [ -f yarn.lock ]; then
                  build="yarn install --frozen-lockfile && yarn build && (yarn export || true)"
                elif [ -f pnpm-lock.yaml ]; then
                  build="pnpm install --frozen-lockfile && pnpm build && (pnpm export || true)"
                elif [ -f package-lock.json ]; then
                  build="npm ci && npm run build && (npm run export || true)"
                elif [ -f package.json ]; then
                  build="npm install && npm run build && (npm run export || true)"
                else
                  build="true"
                fi
                ;;
              php)
                if [ -f composer.json ]; then
                  build="composer install --no-dev --optimize-autoloader"
                else
                  build="true"
                fi
                ;;
              laravel)
                build_cmd=""
                if [ -f composer.json ]; then
                  build_cmd="composer install --no-dev --optimize-autoloader"
                fi
                if [ -f package.json ]; then
                  node_cmd=$(get_node_build_cmd)
                  if [ "$node_cmd" != "true" ]; then
                    if [ -n "$build_cmd" ]; then
                      build_cmd="$build_cmd && $node_cmd"
                    else
                      build_cmd="$node_cmd"
                    fi
                  fi
                fi
                build="${build_cmd:-true}"
                ;;
              static)
                build="true"
                ;;
              *)
                build=$(get_node_build_cmd)
                ;;
            esac
          fi

          # Determine local directory
          local="${{ inputs.local_dir }}"
          local="${local:-$local_json}"

          if [ -z "$local" ]; then
            case "$project_type" in
              node)     local="dist" ;;
              react)    local="build" ;;
              nextjs)   local="out" ;;
              php)      local="." ;;
              laravel)  local="public" ;;
              static)   local="." ;;
              *)        local="dist" ;;
            esac
          fi

          echo "::add-mask::$ftp_password"

          echo "build_cmd=$build" >> "$GITHUB_OUTPUT"
          echo "local_dir=$local" >> "$GITHUB_OUTPUT"
          echo "ftp_host=$ftp_host" >> "$GITHUB_OUTPUT"
          echo "ftp_username=$ftp_username" >> "$GITHUB_OUTPUT"
          echo "ftp_password=$ftp_password" >> "$GITHUB_OUTPUT"
          echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"
          echo "project_type=$project_type" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: ${{ steps.vars.outputs.project_type == 'node' || steps.vars.outputs.project_type == 'react' || steps.vars.outputs.project_type == 'nextjs' || steps.vars.outputs.project_type == 'laravel' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ hashFiles('**/yarn.lock') != '' && 'yarn' || hashFiles('**/pnpm-lock.yaml') != '' && 'pnpm' || hashFiles('**/package-lock.json') != '' && 'npm' || '' }}

      - name: Setup PHP (if required)
        if: ${{ steps.vars.outputs.project_type == 'laravel' || (steps.vars.outputs.project_type == 'php' && hashFiles('**/composer.json') != '') }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, zip
          tools: composer:2

      - name: Build website
        if: ${{ steps.vars.outputs.build_cmd != 'true' }}
        shell: bash
        run: ${{ steps.vars.outputs.build_cmd }}

      - name: Validate build output
        shell: bash
        run: |
          local_dir="${{ steps.vars.outputs.local_dir }}"
          project_type="${{ steps.vars.outputs.project_type }}"
          
          test -d "$local_dir"
          
          case "$project_type" in
            node|react|nextjs|static)
              if [ -f "$local_dir/index.html" ] || [ -f "$local_dir/index.php" ]; then
                echo "Validation passed: Entry file found."
              else
                echo "Warning: No entry file (index.html or index.php) found in $local_dir"
              fi
              ;;
            php|laravel)
              if [ -f "$local_dir/index.php" ] || [ -f "$local_dir/artisan" ] || [ -f "$local_dir/index.html" ]; then
                echo "Validation passed: PHP/Laravel entry file/artisan found."
              else
                echo "Warning: No standard entry file found in $local_dir"
              fi
              ;;
          esac
          
          find "$local_dir" -type f | wc -l

      - name: Archive build artifact
        shell: bash
        run: |
          local_dir="${{ steps.vars.outputs.local_dir }}"
          tar -czf /tmp/deployment-artifact.tar.gz -C "$local_dir" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="Dockerfile" \
            --exclude="docker-compose.yml" \
            --exclude="docker-compose.yaml" \
            --exclude=".dockerignore" \
            .
          mv /tmp/deployment-artifact.tar.gz .

      - name: Store deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-hosting-${{ inputs.project_key }}-${{ github.run_id }}
          path: deployment-artifact.tar.gz
          retention-days: 30

      - name: Deploy to shared hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.vars.outputs.ftp_host }}
          username: ${{ steps.vars.outputs.ftp_username }}
          password: ${{ steps.vars.outputs.ftp_password }}
          local-dir: ${{ steps.vars.outputs.local_dir }}/
          server-dir: ${{ steps.vars.outputs.remote_dir }}/
          log-level: verbose
          timeout: 60000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/Dockerfile
            **/docker-compose.yml
            **/docker-compose.yaml
            **/.dockerignore

  rollback:
    name: Rollback FTP Deployment
    if: ${{ inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate rollback target
        shell: bash
        run: test -n "${{ inputs.rollback_run_id }}"

      - name: Determine FTP credentials
        id: vars
        run: |
          projects_json='${{ secrets.PROJECTS_JSON }}'
          project_key="${{ inputs.project_key }}"
          
          if [ -n "$projects_json" ] && [ "$projects_json" != 'null' ]; then
            ftp_host=$(echo "$projects_json" | jq -r ".[\"$project_key\"].ftpHost // .[\"$project_key\"].ftp_host // .[\"$project_key\"].server // .[\"$project_key\"].host // \"\"")
            ftp_username=$(echo "$projects_json" | jq -r ".[\"$project_key\"].ftpUser // .[\"$project_key\"].ftp_user // .[\"$project_key\"].ftp_username // .[\"$project_key\"].username // .[\"$project_key\"].user // \"\"")
            ftp_password=$(echo "$projects_json" | jq -r ".[\"$project_key\"].ftpPassword // .[\"$project_key\"].ftp_password // .[\"$project_key\"].password // .[\"$project_key\"].pass // \"\"")
            remote_dir=$(echo "$projects_json" | jq -r ".[\"$project_key\"].remoteDir // .[\"$project_key\"].remote_dir // \"\"")
            if [ -z "$remote_dir" ]; then
              remote_dir="${{ inputs.remote_dir }}"
            fi
          fi
          
          ftp_host="${ftp_host:-${{ secrets.FTP_HOST }}}"
          ftp_username="${ftp_username:-${{ secrets.FTP_USERNAME }}}"
          ftp_password="${ftp_password:-${{ secrets.FTP_PASSWORD }}}"
          remote_dir="${remote_dir:-${{ inputs.remote_dir }}}"
          
          echo "::add-mask::$ftp_password"
          
          echo "ftp_host=$ftp_host" >> "$GITHUB_OUTPUT"
          echo "ftp_username=$ftp_username" >> "$GITHUB_OUTPUT"
          echo "ftp_password=$ftp_password" >> "$GITHUB_OUTPUT"
          echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Download previous deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-hosting-${{ inputs.project_key }}-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract rollback artifact
        shell: bash
        run: |
          mkdir rollback-build
          tar -xzf deployment-artifact.tar.gz -C rollback-build

      - name: Upload rollback build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.vars.outputs.ftp_host }}
          username: ${{ steps.vars.outputs.ftp_username }}
          password: ${{ steps.vars.outputs.ftp_password }}
          local-dir: rollback-build/
          server-dir: ${{ steps.vars.outputs.remote_dir }}/
          log-level: verbose
          timeout: 60000
          dangerous-clean-slate: false
